<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="castle-title castle-desc">
  <title id="castle-title">上海 · 城堡下的烟花</title>
  <desc id="castle-desc">夜色里的童话城堡与烟花，两个人牵着手站在广场上，远处是东方明珠的剪影。</desc>
  <defs>
    <linearGradient id="castleSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#161634"/>
      <stop offset=".52" stop-color="#3f2350"/>
      <stop offset="1" stop-color="#8c3b62"/>
    </linearGradient>
    <linearGradient id="castleWall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8fb"/>
      <stop offset=".6" stop-color="#f7ddea"/>
      <stop offset="1" stop-color="#e9bcd3"/>
    </linearGradient>
    <linearGradient id="castleRoof" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d5dffd"/>
      <stop offset=".48" stop-color="#8390e0"/>
      <stop offset="1" stop-color="#3d3f80"/>
    </linearGradient>
    <linearGradient id="castleRoofRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffc9e0"/>
      <stop offset=".5" stop-color="#e0629b"/>
      <stop offset="1" stop-color="#7d2450"/>
    </linearGradient>
    <linearGradient id="castleGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff1c8"/>
      <stop offset=".55" stop-color="#f0c766"/>
      <stop offset="1" stop-color="#c8913a"/>
    </linearGradient>
    <linearGradient id="castleGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0c4"/>
      <stop offset="1" stop-color="#ffab8f"/>
    </linearGradient>
    <linearGradient id="plaza" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2040"/>
      <stop offset="1" stop-color="#1b1026"/>
    </linearGradient>
    <linearGradient id="coatRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd2e3"/>
      <stop offset="1" stop-color="#e67bac"/>
    </linearGradient>
    <linearGradient id="coatNight" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a4f74"/>
      <stop offset="1" stop-color="#17233c"/>
    </linearGradient>
    <radialGradient id="halo" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd9ec" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffd9ec" stop-opacity="0"/>
    </radialGradient>
    <filter id="castleSoft"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

